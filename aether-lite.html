<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Lite</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            padding: 16px;
            color: #e0e0e0;
            transition: 0.2s;
        }
        body.light {
            background: #e8ecf2;
            color: #1a1a2e;
        }
        body.light .card { background: white; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        body.light .profile-bar { background: #ffffffcc; backdrop-filter: blur(10px); }
        body.light .status { background: #e0e0e0; color: #1a1a2e; }
        body.light .group-item { background: #f0f0f5; }
        body.light .group-item:hover { background: #e0e0e8; }
        body.light input, body.light textarea { background: white; color: #1a1a2e; border: 1px solid #ccc; }
        body.light .message.other { background: #e8e8f0; color: #1a1a2e; }
        body.light .chat-area { background: #f5f5fa; }
        body.light .invite-code-box { background: #f0f0f5; }
        
        .container { max-width: 1600px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .header h1 { font-size: 2rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .theme-btn { background: rgba(255,255,255,0.1); border: none; padding: 8px 20px; border-radius: 40px; color: white; cursor: pointer; }
        body.light .theme-btn { background: rgba(0,0,0,0.1); color: #1a1a2e; }
        
        .profile-bar {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            padding: 10px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; overflow: hidden; }
        .nickname { font-size: 1.2rem; font-weight: 600; background: rgba(255,255,255,0.1); padding: 6px 18px; border-radius: 40px; cursor: pointer; }
        .profile-btn { background: rgba(255,255,255,0.1); border: none; padding: 6px 16px; border-radius: 40px; color: #e0e0e0; cursor: pointer; font-size: 13px; }
        body.light .profile-btn { background: rgba(0,0,0,0.08); color: #1a1a2e; }
        
        .flex { display: flex; gap: 20px; flex-wrap: wrap; }
        .card {
            background: rgba(20, 20, 40, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            flex: 1;
            min-width: 300px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .card h3 { margin-bottom: 15px; font-size: 1.3rem; }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px;
            max-height: 450px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        .video-tile {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .video-tile video { width: 100%; height: 100%; object-fit: cover; }
        .video-tile .video-info {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.7);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 11px;
        }
        .video-tile .video-info .avatar-small { width: 22px; height: 22px; border-radius: 50%; background: #667eea; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 9px 18px;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            margin: 4px;
            font-size: 13px;
            transition: 0.2s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button.danger { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        button.success { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        button.warning { background: linear-gradient(135deg, #f39c12, #e67e22); }
        
        .group-item {
            background: rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 10px 14px;
            margin: 8px 0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .group-item:hover { background: rgba(255,255,255,0.15); }
        .group-item.active { background: linear-gradient(135deg, #667eea30, #764ba230); border-left: 3px solid #667eea; }
        .group-delete { background: none; color: #e74c3c; padding: 4px 10px; margin: 0; font-size: 12px; }
        .group-delete:hover { background: #e74c3c20; transform: none; }
        
        .invite-code-box {
            background: rgba(0,0,0,0.3);
            border-radius: 14px;
            padding: 10px 14px;
            margin: 12px 0;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .invite-code-box input { flex: 1; padding: 10px 14px; border-radius: 40px; font-family: monospace; font-size: 12px; background: #1e1e2e; color: white; border: none; }
        
        .chat-area {
            height: 300px;
            overflow-y: auto;
            background: rgba(0,0,0,0.25);
            border-radius: 18px;
            padding: 12px;
            margin: 12px 0;
        }
        .message {
            margin: 8px 0;
            padding: 8px 12px;
            border-radius: 18px;
            max-width: 85%;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .message-avatar { width: 28px; height: 28px; border-radius: 50%; background: #667eea; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; overflow: hidden; }
        .message-content { flex: 1; }
        .message-sender { font-size: 10px; opacity: 0.7; margin-bottom: 3px; }
        .message-text { font-size: 13px; word-break: break-word; }
        .message.own { margin-left: auto; flex-direction: row-reverse; }
        .message.own .message-content { text-align: right; }
        .message.own { background: linear-gradient(135deg, #667eea, #764ba2); }
        .message.other { background: #2a2a3e; }
        .message-system { background: #1a1a2e; text-align: center; max-width: 100%; justify-content: center; opacity: 0.7; }
        
        .file-attachment { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 6px 10px; margin-top: 5px; font-size: 11px; }
        .file-attachment a { color: #a78bfa; text-decoration: none; }
        .file-preview { max-width: 150px; max-height: 120px; border-radius: 8px; margin-top: 5px; }
        
        .flex-row { display: flex; gap: 8px; align-items: center; }
        input { padding: 10px 14px; border-radius: 40px; border: none; background: #1e1e2e; color: #e0e0e0; flex: 1; font-size: 13px; }
        .status { padding: 10px 14px; border-radius: 14px; background: rgba(0,0,0,0.3); margin-top: 10px; font-size: 12px; }
        
        @media (max-width: 700px) {
            .message { max-width: 95%; }
            button { padding: 7px 12px; font-size: 11px; }
            .card { padding: 14px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div class="header"><h1>🌀 Aether Lite</h1></div>
        <button class="theme-btn" id="themeBtn">🌓 Светлая/Тёмная</button>
    </div>

    <div class="profile-bar">
        <div class="avatar" id="avatarBtn"><span id="avatarEmoji">😀</span></div>
        <div class="nickname" id="nicknameBtn"><span id="nicknameDisplay">Гость</span></div>
        <button id="changeNickBtn" class="profile-btn">✏️ Ник</button>
        <button id="changeAvatarBtn" class="profile-btn">🖼️ Аватар</button>
        <input type="file" id="avatarFileInput" accept="image/*" style="display:none">
    </div>

    <div class="status" id="statusMsg">🔄 Запрос доступа к камере и микрофону...</div>

    <div class="flex">
        <div class="card" style="flex: 2">
            <h3>🎥 Видеозвонок</h3>
            <div class="video-grid" id="videoGrid"></div>
            <div>
                <button id="createGroupBtn" class="success">➕ Создать группу</button>
                <button id="joinGroupBtn">🔗 Присоединиться</button>
                <button id="screenBtn">🖥️ Экран</button>
                <button id="micBtn">🎤 Выкл. микрофон</button>
                <button id="camBtn">📷 Выкл. камеру</button>
                <button id="leaveBtn" class="danger">🚪 Выйти</button>
            </div>
            
            <div id="invitePanel" style="display:none;" class="invite-code-box">
                <span>🔑 Код:</span>
                <input type="text" id="inviteCodeInput" readonly>
                <button id="copyInviteBtn">📋 Копировать</button>
            </div>
            
            <div style="margin-top: 18px;">
                <h4>📁 Мои группы</h4>
                <div id="groupsList"></div>
            </div>
        </div>

        <div class="card">
            <h3>💬 Чат</h3>
            <div class="chat-area" id="chatArea"></div>
            <div class="flex-row">
                <input type="text" id="chatInput" placeholder="Сообщение..." disabled>
                <button id="sendBtn" disabled>📤</button>
                <button id="fileBtn" disabled class="warning">📎</button>
            </div>
            <div style="margin-top: 8px; font-size: 12px;" id="memberCount">👥 Участников: 0</div>
        </div>
    </div>
</div>

<script>
    // ========== AETHER LITE - РАБОЧАЯ ВЕРСИЯ ==========
    let localStream = null;
    let currentGroupId = null;
    let peers = new Map();
    let micEnabled = true;
    let camEnabled = true;
    let screenStream = null;
    let originalVideoTrack = null;
    
    // Профиль
    let userProfile = JSON.parse(localStorage.getItem('aether_profile') || '{"nickname":"Гость","avatarType":"emoji","avatarData":"😀"}');
    let savedGroups = JSON.parse(localStorage.getItem('aether_groups') || '[]');
    let groupMessages = JSON.parse(localStorage.getItem('aether_messages') || '{}');
    let groupFiles = JSON.parse(localStorage.getItem('aether_files') || '{}');
    
    let currentUserId = localStorage.getItem('aether_userId');
    if (!currentUserId) {
        currentUserId = 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        localStorage.setItem('aether_userId', currentUserId);
    }
    
    const configuration = {
        iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" },
            { urls: "stun:stun2.l.google.com:19302" }
        ]
    };
    
    // ========== ТЕМА ==========
    let isDark = localStorage.getItem('aether_theme') !== 'light';
    function applyTheme() { document.body.classList.toggle('light', !isDark); }
    function toggleTheme() { isDark = !isDark; localStorage.setItem('aether_theme', isDark ? 'dark' : 'light'); applyTheme(); }
    applyTheme();
    
    // ========== ЗАПРОС РАЗРЕШЕНИЙ (ОБЯЗАТЕЛЬНО) ==========
    async function requestPermissions() {
        try {
            document.getElementById('statusMsg').innerHTML = "🎥 Запрос камеры и микрофона... Разрешите в браузере";
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            originalVideoTrack = localStream.getVideoTracks()[0];
            document.getElementById('statusMsg').innerHTML = "✅ Доступ получен! Можно создавать группы и звонить";
            addVideoTile(currentUserId, localStream, true);
            updateProfileUI();
            return true;
        } catch(err) {
            console.error(err);
            document.getElementById('statusMsg').innerHTML = "❌ Ошибка: Нет доступа к камере/микрофону. Нажмите на значок замка в адресной строке и разрешите доступ.";
            return false;
        }
    }
    
    // ========== ПРОФИЛЬ ==========
    function updateProfileUI() {
        document.getElementById('nicknameDisplay').innerText = userProfile.nickname;
        let av = document.getElementById('avatarEmoji');
        if (userProfile.avatarType === 'emoji') {
            av.innerHTML = userProfile.avatarData;
            av.style.fontSize = "24px";
            av.style.background = "none";
        } else {
            av.innerHTML = `<img src="${userProfile.avatarData}" style="width:100%;height:100%;object-fit:cover">`;
            av.style.background = "none";
        }
        renderChat();
        renderGroupsList();
        // Обновляем имя в видео
        let nickSpan = document.querySelector(`#tile_${currentUserId} .nick-text`);
        if (nickSpan) nickSpan.innerText = userProfile.nickname;
    }
    
    function changeNickname() {
        let newNick = prompt("Новый никнейм:", userProfile.nickname);
        if (newNick?.trim()) {
            userProfile.nickname = newNick.trim();
            localStorage.setItem('aether_profile', JSON.stringify(userProfile));
            updateProfileUI();
            if (currentGroupId) saveMessage(currentGroupId, 'system', `${userProfile.nickname} сменил ник`);
        }
    }
    
    function changeAvatar() {
        let choice = prompt("1 - Эмодзи\n2 - Загрузить фото", "1");
        if (choice === '1') {
            let emoji = prompt("Введите эмодзи:", "😀");
            if (emoji) {
                userProfile.avatarType = 'emoji';
                userProfile.avatarData = emoji;
                localStorage.setItem('aether_profile', JSON.stringify(userProfile));
                updateProfileUI();
            }
        } else if (choice === '2') {
            document.getElementById('avatarFileInput').click();
        }
    }
    
    document.getElementById('avatarFileInput').onchange = (e) => {
        let file = e.target.files[0];
        if (file?.type.startsWith('image/')) {
            let reader = new FileReader();
            reader.onload = (ev) => {
                userProfile.avatarType = 'image';
                userProfile.avatarData = ev.target.result;
                localStorage.setItem('aether_profile', JSON.stringify(userProfile));
                updateProfileUI();
            };
            reader.readAsDataURL(file);
        }
    };
    
    // ========== ФАЙЛЫ ==========
    function isExeFile(name) {
        let ext = name.split('.').pop().toLowerCase();
        return ['exe','msi','bat','cmd','scr','com','vbs','ps1'].includes(ext);
    }
    
    function sendFile() {
        if (!currentGroupId) { alert("Сначала войдите в группу"); return; }
        let input = document.createElement('input');
        input.type = 'file';
        input.onchange = (e) => {
            let file = e.target.files[0];
            if (!file) return;
            if (isExeFile(file.name)) { alert("⛔ EXE файлы запрещены"); return; }
            if (file.size > 30 * 1024 * 1024) { alert("Файл > 30 МБ"); return; }
            let reader = new FileReader();
            reader.onload = (ev) => {
                let fileId = Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                if (!groupFiles[currentGroupId]) groupFiles[currentGroupId] = {};
                groupFiles[currentGroupId][fileId] = { name: file.name, type: file.type, size: file.size, data: ev.target.result };
                localStorage.setItem('aether_files', JSON.stringify(groupFiles));
                saveMessage(currentGroupId, currentUserId, `📎 Файл: ${file.name}`, fileId);
            };
            reader.readAsDataURL(file);
        };
        input.click();
    }
    
    // ========== СООБЩЕНИЯ ==========
    function saveMessage(groupId, sender, text, fileId = null) {
        if (!groupMessages[groupId]) groupMessages[groupId] = [];
        let senderProfile = (sender === currentUserId) ? userProfile : { nickname: sender.slice(0,8), avatarType: 'emoji', avatarData: '👤' };
        groupMessages[groupId].push({ sender, senderNick: senderProfile.nickname, senderAvatar: senderProfile, text, fileId, time: Date.now() });
        if (groupMessages[groupId].length > 500) groupMessages[groupId].shift();
        localStorage.setItem('aether_messages', JSON.stringify(groupMessages));
        if (currentGroupId === groupId) renderChat();
    }
    
    function renderChat() {
        let area = document.getElementById('chatArea');
        if (!currentGroupId || !groupMessages[currentGroupId]?.length) {
            area.innerHTML = '<div style="text-align:center;opacity:0.5;padding:20px;">💬 Нет сообщений</div>';
            return;
        }
        area.innerHTML = '';
        for (let msg of groupMessages[currentGroupId]) {
            let div = document.createElement('div');
            div.className = 'message';
            if (msg.sender === currentUserId) div.classList.add('own');
            else if (msg.sender === 'system') div.classList.add('message-system');
            else div.classList.add('other');
            
            let avatarDiv = document.createElement('div');
            avatarDiv.className = 'message-avatar';
            if (msg.sender !== 'system') {
                let av = msg.senderAvatar || { avatarType: 'emoji', avatarData: '👤' };
                if (av.avatarType === 'emoji') avatarDiv.innerHTML = `<span style="font-size:14px;">${av.avatarData}</span>`;
                else avatarDiv.innerHTML = `<img src="${av.avatarData}" style="width:100%;height:100%;object-fit:cover">`;
            } else avatarDiv.innerHTML = '📢';
            
            let contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            let senderName = msg.sender === currentUserId ? userProfile.nickname : (msg.senderNick || msg.sender.slice(0,8));
            contentDiv.innerHTML = `<div class="message-sender">${msg.sender === 'system' ? '📢 Система' : senderName}</div>`;
            
            if (msg.fileId && groupFiles[currentGroupId]?.[msg.fileId]) {
                let file = groupFiles[currentGroupId][msg.fileId];
                let isImg = file.type.startsWith('image/');
                if (isImg) contentDiv.innerHTML += `<div class="file-attachment"><img src="${file.data}" class="file-preview"><br><a href="${file.data}" download="${file.name}">⬇️ ${file.name}</a></div>`;
                else contentDiv.innerHTML += `<div class="file-attachment">📎 ${file.name} (${(file.size/1024).toFixed(1)} KB)<br><a href="${file.data}" download="${file.name}">⬇️ Скачать</a></div>`;
            } else if (msg.text) {
                contentDiv.innerHTML += `<div class="message-text">${escapeHtml(msg.text)}</div>`;
            }
            
            div.appendChild(avatarDiv);
            div.appendChild(contentDiv);
            area.appendChild(div);
        }
        area.scrollTop = area.scrollHeight;
    }
    
    function escapeHtml(s) { return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    
    // ========== ВИДЕО ==========
    function addVideoTile(userId, stream, isLocal = false) {
        if (document.getElementById(`tile_${userId}`)) return;
        let grid = document.getElementById('videoGrid');
        let tile = document.createElement('div'); tile.className = 'video-tile'; tile.id = `tile_${userId}`;
        let video = document.createElement('video'); video.id = `video_${userId}`; video.autoplay = true; video.playsinline = true;
        if (isLocal) video.muted = true;
        video.srcObject = stream;
        let info = document.createElement('div'); info.className = 'video-info';
        let avatarSmall = document.createElement('div'); avatarSmall.className = 'avatar-small';
        let nickSpan = document.createElement('span'); nickSpan.className = 'nick-text'; nickSpan.innerText = isLocal ? userProfile.nickname : userId.slice(0,8);
        if (isLocal) {
            if (userProfile.avatarType === 'emoji') avatarSmall.innerHTML = `<span style="font-size:10px;">${userProfile.avatarData}</span>`;
            else avatarSmall.innerHTML = `<img src="${userProfile.avatarData}" style="width:100%;height:100%;object-fit:cover">`;
        } else avatarSmall.innerHTML = '👤';
        info.appendChild(avatarSmall); info.appendChild(nickSpan);
        tile.appendChild(video); tile.appendChild(info);
        grid.appendChild(tile);
        video.play().catch(e => console.log);
    }
    
    function removeVideoTile(userId) { document.getElementById(`tile_${userId}`)?.remove(); }
    
    // ========== ДЕМОНСТРАЦИЯ ЭКРАНА (РАБОТАЕТ) ==========
    async function startScreenShare() {
        if (!localStream) {
            alert("Сначала получите доступ к камере");
            return;
        }
        try {
            document.getElementById('statusMsg').innerHTML = "🖥️ Запрос демонстрации экрана...";
            screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
            let screenTrack = screenStream.getVideoTracks()[0];
            
            // Заменяем видеодорожку
            let videoSender = null;
            if (localStream.getVideoTracks().length > 0) {
                let oldTrack = localStream.getVideoTracks()[0];
                localStream.removeTrack(oldTrack);
                localStream.addTrack(screenTrack);
                oldTrack.stop();
            } else {
                localStream.addTrack(screenTrack);
            }
            
            // Обновляем видео в своей плитке
            let myVideo = document.getElementById(`video_${currentUserId}`);
            if (myVideo) myVideo.srcObject = localStream;
            
            screenTrack.onended = () => {
                // Восстанавливаем камеру
                if (originalVideoTrack) {
                    localStream.addTrack(originalVideoTrack);
                    if (myVideo) myVideo.srcObject = localStream;
                }
                document.getElementById('statusMsg').innerHTML = "✅ Демонстрация экрана завершена";
            };
            
            document.getElementById('statusMsg').innerHTML = "🖥️ Демонстрация экрана идёт";
        } catch(err) {
            console.error(err);
            alert("Не удалось начать демонстрацию экрана. Разрешите доступ.");
            document.getElementById('statusMsg').innerHTML = "❌ Ошибка демонстрации экрана";
        }
    }
    
    // ========== ГРУППЫ ==========
    function saveGroups() { localStorage.setItem('aether_groups', JSON.stringify(savedGroups)); renderGroupsList(); }
    
    function renderGroupsList() {
        let container = document.getElementById('groupsList');
        container.innerHTML = '';
        for (let g of savedGroups) {
            let div = document.createElement('div');
            div.className = 'group-item' + (currentGroupId === g.id ? ' active' : '');
            div.innerHTML = `<span>📁 ${g.name}</span><span style="display:flex;gap:6px;"><span style="font-size:11px;">${g.members || 0} уч.</span><button class="group-delete" data-id="${g.id}" title="Удалить">🗑️</button></span>`;
            div.querySelector('.group-delete')?.addEventListener('click', (e) => { e.stopPropagation(); deleteGroup(g.id); });
            div.addEventListener('click', () => joinGroupById(g.id));
            container.appendChild(div);
        }
        if (!savedGroups.length) container.innerHTML = '<div style="opacity:0.5;padding:15px;text-align:center;">➕ Создайте первую группу</div>';
    }
    
    function deleteGroup(groupId) {
        let group = savedGroups.find(g => g.id === groupId);
        if (confirm(`Удалить группу "${group?.name}"? Всё удалится навсегда.`)) {
            if (currentGroupId === groupId) leaveGroup();
            savedGroups = savedGroups.filter(g => g.id !== groupId);
            delete groupMessages[groupId];
            delete groupFiles[groupId];
            localStorage.setItem('aether_groups', JSON.stringify(savedGroups));
            localStorage.setItem('aether_messages', JSON.stringify(groupMessages));
            localStorage.setItem('aether_files', JSON.stringify(groupFiles));
            saveGroups();
            document.getElementById('statusMsg').innerHTML = "🗑️ Группа удалена";
        }
    }
    
    function showInviteCode(groupId) {
        let g = savedGroups.find(g => g.id === groupId);
        if (g?.inviteCode) {
            document.getElementById('inviteCodeInput').value = g.inviteCode;
            document.getElementById('invitePanel').style.display = 'flex';
        }
    }
    
    function createGroup() {
        let name = prompt("Название группы:", "Моя группа");
        if (!name) return;
        let groupId = 'g_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        let inviteCode = btoa(groupId).replace(/=/g, '').slice(0, 24);
        savedGroups.push({ id: groupId, name: name, members: 1, inviteCode: inviteCode });
        saveGroups();
        joinGroupById(groupId);
        showInviteCode(groupId);
    }
    
    function joinGroup() {
        let code = prompt("Введите код приглашения:");
        if (!code) return;
        let found = savedGroups.find(g => g.inviteCode === code || g.id === code);
        if (found) joinGroupById(found.id);
        else alert("❌ Группа не найдена");
    }
    
    async function joinGroupById(groupId) {
        if (currentGroupId) await leaveGroup();
        currentGroupId = groupId;
        let group = savedGroups.find(g => g.id === groupId);
        if (group) { group.members = (group.members || 0) + 1; saveGroups(); showInviteCode(groupId); }
        document.getElementById('statusMsg').innerHTML = `🟢 В группе: ${group?.name || groupId}`;
        document.getElementById('chatInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('fileBtn').disabled = false;
        document.getElementById('memberCount').innerHTML = `👥 Участников: ${peers.size + 1}`;
        renderChat();
        saveMessage(groupId, 'system', `${userProfile.nickname} присоединился`);
    }
    
    async function leaveGroup() {
        if (!currentGroupId) return;
        let group = savedGroups.find(g => g.id === currentGroupId);
        if (group) group.members = Math.max(0, (group.members || 1) - 1);
        saveGroups();
        saveMessage(currentGroupId, 'system', `${userProfile.nickname} покинул группу`);
        for (let [uid] of peers) removeVideoTile(uid);
        peers.clear();
        currentGroupId = null;
        document.getElementById('statusMsg').innerHTML = "⚪ Не в группе";
        document.getElementById('chatInput').disabled = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('fileBtn').disabled = true;
        document.getElementById('memberCount').innerHTML = "👥 0";
        document.getElementById('chatArea').innerHTML = '<div style="text-align:center;opacity:0.5;padding:20px;">💬 Войдите в группу</div>';
        document.getElementById('invitePanel').style.display = 'none';
    }
    
    function sendMessage() {
        let input = document.getElementById('chatInput');
        let text = input.value.trim();
        if (!text || !currentGroupId) return;
        saveMessage(currentGroupId, currentUserId, text);
        input.value = '';
    }
    
    function toggleMic() {
        if (!localStream) return;
        micEnabled = !micEnabled;
        localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
        document.getElementById('micBtn').innerHTML = micEnabled ? "🎤 Выкл. микрофон" : "🎙️ Вкл. микрофон";
    }
    
    function toggleCam() {
        if (!localStream) return;
        camEnabled = !camEnabled;
        localStream.getVideoTracks().forEach(t => t.enabled = camEnabled);
        document.getElementById('camBtn').innerHTML = camEnabled ? "📷 Выкл. камеру" : "📷 Вкл. камеру";
    }
    
    function copyInvite() {
        let input = document.getElementById('inviteCodeInput');
        input.select(); document.execCommand('copy');
        document.getElementById('statusMsg').innerHTML = "✅ Код скопирован!";
        setTimeout(() => { if(currentGroupId) document.getElementById('statusMsg').innerHTML = `🟢 В группе: ${savedGroups.find(g=>g.id===currentGroupId)?.name}`; }, 2000);
    }
    
    // ========== ЗАПУСК ==========
    async function init() {
        await requestPermissions();
        
        document.getElementById('themeBtn').onclick = toggleTheme;
        document.getElementById('createGroupBtn').onclick = createGroup;
        document.getElementById('joinGroupBtn').onclick = joinGroup;
        document.getElementById('screenBtn').onclick = startScreenShare;
        document.getElementById('micBtn').onclick = toggleMic;
        document.getElementById('camBtn').onclick = toggleCam;
        document.getElementById('leaveBtn').onclick = leaveGroup;
        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('fileBtn').onclick = sendFile;
        document.getElementById('changeNickBtn').onclick = changeNickname;
        document.getElementById('changeAvatarBtn').onclick = changeAvatar;
        document.getElementById('nicknameBtn').onclick = changeNickname;
        document.getElementById('avatarBtn').onclick = changeAvatar;
        document.getElementById('copyInviteBtn').onclick = copyInvite;
        document.getElementById('chatInput').addEventListener('keypress', e => { if(e.key === 'Enter') sendMessage(); });
        
        renderGroupsList();
        updateProfileUI();
    }
    
    init();
</script>
</body>
</html>
