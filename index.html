<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aether Lite — Голосовой канал</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #202225;
            color: #dcddde;
            height: 100vh;
            overflow: hidden;
        }
        .app { display: flex; height: 100vh; }
        
        /* Серверная панель */
        .servers-bar {
            width: 72px;
            background: #1e1f22;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px 0;
            overflow-y: auto;
        }
        .server-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #5865f2, #4752c4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 24px;
        }
        .server-icon:hover { border-radius: 16px; background: #5865f2; }
        .server-icon.active { border-radius: 16px; background: #5865f2; position: relative; }
        .server-icon.active::before {
            content: '';
            position: absolute;
            left: -12px;
            width: 4px;
            height: 20px;
            background: white;
            border-radius: 4px;
        }
        
        /* Каналы */
        .channels-bar {
            width: 240px;
            background: #2b2d31;
            display: flex;
            flex-direction: column;
            padding: 16px 8px;
        }
        .channel-header { padding: 0 8px 16px; font-weight: 600; font-size: 12px; border-bottom: 1px solid #1e1f22; }
        .channel-group { margin-bottom: 16px; }
        .channel-group-name { font-size: 12px; font-weight: 600; color: #949ba4; padding: 8px 8px 4px; text-transform: uppercase; }
        .channel-item {
            padding: 6px 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 15px;
            color: #949ba4;
        }
        .channel-item:hover { background: #35373d; color: #dbdee1; }
        .channel-item.active { background: #404249; color: #dbdee1; }
        
        /* Основная область */
        .main-area { flex: 1; display: flex; }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #313338;
        }
        .chat-header {
            height: 48px;
            padding: 0 16px;
            border-bottom: 1px solid #1e1f22;
            display: flex;
            align-items: center;
            font-weight: 600;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message { display: flex; gap: 12px; align-items: flex-start; }
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .message-content { flex: 1; }
        .message-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
        .message-author { font-weight: 600; color: white; }
        .message-time { font-size: 10px; color: #949ba4; }
        .message-text { font-size: 15px; line-height: 1.3; }
        
        /* Список участников */
        .members-area {
            width: 240px;
            background: #2b2d31;
            padding: 16px 8px;
            border-left: 1px solid #1e1f22;
        }
        .members-header { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #949ba4; padding: 0 8px 12px; }
        .member-item { padding: 8px; margin: 2px 0; border-radius: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .member-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            overflow: hidden;
        }
        .voice-indicator { width: 8px; height: 8px; border-radius: 50%; background: #23a55a; margin-left: auto; }
        .voice-speaking { background: #f0b232; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        /* Панель ввода */
        .input-area {
            padding: 16px;
            background: #383a40;
            margin: 0 16px 16px;
            border-radius: 40px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .input-area input { flex: 1; background: none; border: none; color: white; font-size: 15px; outline: none; }
        .action-btn { background: none; border: none; color: #b5bac1; cursor: pointer; font-size: 20px; padding: 4px; }
        
        /* Видеопанель */
        .video-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e1f22;
            border-radius: 12px;
            padding: 8px;
            display: flex;
            gap: 8px;
            z-index: 100;
            box-shadow: 0 4px 12px black;
        }
        .video-panel video { width: 160px; border-radius: 8px; background: black; }
        
        button {
            background: #5865f2;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 12px;
        }
        .status-badge {
            background: #23a55a;
            border-radius: 50%;
            width: 10px;
            height: 10px;
            position: absolute;
            bottom: 0;
            right: 0;
        }
        .permission-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e1f22;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            z-index: 200;
            box-shadow: 0 0 50px black;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="servers-bar">
        <div class="server-icon active" id="serverBtn">🌀</div>
    </div>

    <div class="channels-bar">
        <div class="channel-header"><span id="groupNameDisplay">Aether Lite</span></div>
        <div class="channel-group">
            <div class="channel-group-name">Текстовые каналы</div>
            <div class="channel-item active" id="generalChannelBtn"><span># 💬</span> <span>общий</span></div>
        </div>
        <div class="channel-group">
            <div class="channel-group-name">Голосовые</div>
            <div class="channel-item" id="voiceChannelBtn"><span>🔊</span> <span>Голосовой канал</span></div>
        </div>
        <div style="margin-top: auto; padding: 12px 8px;">
            <button id="createGroupBtn" style="width:100%;">➕ Создать группу</button>
            <button id="joinGroupBtn" style="width:100%; margin-top: 8px;">🔗 Присоединиться</button>
            <button id="leaveGroupBtn" style="width:100%; margin-top: 8px; background:#da373c;">🚪 Выйти</button>
        </div>
    </div>

    <div class="main-area">
        <div class="chat-area">
            <div class="chat-header"><span># 💬 общий</span></div>
            <div class="messages-container" id="messagesContainer">
                <div style="text-align:center; opacity:0.6;">🎤 Запрос разрешений...</div>
            </div>
            <div class="input-area">
                <input type="text" id="chatInput" placeholder="Сообщение..." disabled>
                <button class="action-btn" id="fileBtn" disabled>📎</button>
                <button class="action-btn" id="micToggleBtn" disabled>🎤</button>
                <button class="action-btn" id="camToggleBtn" disabled>📷</button>
                <button class="action-btn" id="screenBtn" disabled>🖥️</button>
            </div>
        </div>

        <div class="members-area">
            <div class="members-header">В голосовом канале — <span id="voiceMemberCount">0</span></div>
            <div id="voiceMembersList"></div>
            <div class="members-header" style="margin-top: 20px;">Участники группы — <span id="groupMemberCount">0</span></div>
            <div id="groupMembersList"></div>
        </div>
    </div>
</div>

<div class="video-panel" id="videoPanel" style="display: none;">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <button id="closeVideoBtn" style="background:#da373c; padding:4px 8px;">✖️</button>
</div>

<script>
    // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
    let localStream = null;
    let currentGroupId = null;
    let inVoiceChannel = false;
    let voicePeerConnections = new Map(); // userId -> RTCPeerConnection
    let micEnabled = true;
    let camEnabled = true;
    let originalVideoTrack = null;
    
    // Профиль
    let userProfile = JSON.parse(localStorage.getItem('aether_profile') || '{"nickname":"Гость","avatarType":"emoji","avatarData":"👤"}');
    let savedGroups = JSON.parse(localStorage.getItem('aether_groups') || '[]');
    let groupMessages = JSON.parse(localStorage.getItem('aether_messages') || '{}');
    let groupFiles = JSON.parse(localStorage.getItem('aether_files') || '{}');
    let voiceMembers = new Set(); // userId в голосовом канале
    
    let currentUserId = localStorage.getItem('aether_userId');
    if (!currentUserId) {
        currentUserId = 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        localStorage.setItem('aether_userId', currentUserId);
    }
    
    const configuration = {
        iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" }
        ]
    };
    
    // ========== ЗАПРОС ВСЕХ РАЗРЕШЕНИЙ ==========
    async function requestAllPermissions() {
        try {
            // 1. Микрофон + камера
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            originalVideoTrack = localStream.getVideoTracks()[0];
            document.getElementById('localVideo').srcObject = localStream;
            document.getElementById('videoPanel').style.display = 'flex';
            
            // 2. Уведомления
            if (Notification.permission === 'default') {
                await Notification.requestPermission();
            }
            
            // 3. Проверка поддержки экрана
            if (navigator.mediaDevices.getDisplayMedia) {
                console.log("Screen capture supported");
            }
            
            enableMediaControls(true);
            addSystemMessage("✅ Все разрешения получены! Можно создавать группы и заходить в голосовой канал.");
            return true;
        } catch(err) {
            console.error(err);
            addSystemMessage("❌ Нет доступа к микрофону/камере. Нажмите на значок замка в адресной строке и разрешите доступ.");
            return false;
        }
    }
    
    function enableMediaControls(enabled) {
        document.getElementById('micToggleBtn').disabled = !enabled;
        document.getElementById('camToggleBtn').disabled = !enabled;
        document.getElementById('screenBtn').disabled = !enabled;
        if (enabled) {
            document.getElementById('micToggleBtn').innerHTML = "🎤";
            document.getElementById('camToggleBtn').innerHTML = "📷";
        }
    }
    
    // ========== ГОЛОСОВОЙ КАНАЛ ==========
    async function joinVoiceChannel() {
        if (!localStream) {
            addSystemMessage("❌ Сначала разрешите доступ к микрофону");
            return;
        }
        if (!currentGroupId) {
            addSystemMessage("❌ Сначала создайте или присоединитесь к группе");
            return;
        }
        
        if (inVoiceChannel) {
            addSystemMessage("🔊 Вы уже в голосовом канале");
            return;
        }
        
        inVoiceChannel = true;
        voiceMembers.add(currentUserId);
        updateVoiceUI();
        addSystemMessage("🔊 Вы вошли в голосовой канал");
        
        // Симулируем P2P голосовые соединения с другими участниками
        // В реальном приложении здесь был бы сигнальный сервер
        // Для демонстрации: просто показываем что вы в голосе
        startVoiceBroadcast();
    }
    
    function startVoiceBroadcast() {
        // Создаём аудио-контекст для анализа уровня громкости (индикатор говорящего)
        if (localStream) {
            const audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(localStream);
            const analyser = audioContext.createAnalyser();
            source.connect(analyser);
            
            // Анимируем индикатор
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            function checkVoice() {
                if (!inVoiceChannel) return;
                analyser.getByteTimeDomainData(dataArray);
                let max = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    let v = Math.abs(dataArray[i] - 128) / 128;
                    if (v > max) max = v;
                }
                const isSpeaking = max > 0.05;
                const indicator = document.getElementById(`voice_indicator_${currentUserId}`);
                if (indicator) {
                    if (isSpeaking) indicator.classList.add('voice-speaking');
                    else indicator.classList.remove('voice-speaking');
                }
                requestAnimationFrame(checkVoice);
            }
            checkVoice();
        }
    }
    
    function leaveVoiceChannel() {
        if (!inVoiceChannel) return;
        inVoiceChannel = false;
        voiceMembers.delete(currentUserId);
        for (let pc of voicePeerConnections.values()) {
            pc.close();
        }
        voicePeerConnections.clear();
        updateVoiceUI();
        addSystemMessage("🔇 Вы покинули голосовой канал");
    }
    
    function updateVoiceUI() {
        const container = document.getElementById('voiceMembersList');
        document.getElementById('voiceMemberCount').innerText = voiceMembers.size;
        container.innerHTML = '';
        for (let uid of voiceMembers) {
            const isMe = uid === currentUserId;
            const div = document.createElement('div');
            div.className = 'member-item';
            div.innerHTML = `
                <div class="member-avatar">${isMe ? (userProfile.avatarType === 'emoji' ? userProfile.avatarData : '👤') : '👤'}</div>
                <div style="flex:1;">${isMe ? userProfile.nickname : uid.slice(0, 10)}</div>
                <div class="voice-indicator" id="voice_indicator_${uid}"></div>
            `;
            container.appendChild(div);
        }
        if (voiceMembers.size === 0) {
            container.innerHTML = '<div style="padding:8px; opacity:0.6;">Никого нет</div>';
        }
    }
    
    // ========== СООБЩЕНИЯ ==========
    function addSystemMessage(text) {
        const container = document.getElementById('messagesContainer');
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `<div class="message-content"><div class="message-text" style="color:#a6a7aa;">📢 ${text}</div></div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }
    
    function addChatMessage(senderNick, text) {
        const container = document.getElementById('messagesContainer');
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `
            <div class="message-avatar">${userProfile.avatarType === 'emoji' ? userProfile.avatarData : '👤'}</div>
            <div class="message-content">
                <div class="message-header">
                    <span class="message-author">${senderNick}</span>
                    <span class="message-time">${new Date().toLocaleTimeString()}</span>
                </div>
                <div class="message-text">${escapeHtml(text)}</div>
            </div>
        `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }
    
    function saveMessage(groupId, text) {
        if (!groupMessages[groupId]) groupMessages[groupId] = [];
        groupMessages[groupId].push({ sender: currentUserId, senderNick: userProfile.nickname, text, time: Date.now() });
        localStorage.setItem('aether_messages', JSON.stringify(groupMessages));
        if (currentGroupId === groupId) {
            addChatMessage(userProfile.nickname, text);
        }
    }
    
    function escapeHtml(s) { return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    
    // ========== ГРУППЫ ==========
    function saveGroups() { localStorage.setItem('aether_groups', JSON.stringify(savedGroups)); updateGroupMembersUI(); }
    
    function updateGroupMembersUI() {
        if (!currentGroupId) return;
        const group = savedGroups.find(g => g.id === currentGroupId);
        document.getElementById('groupMemberCount').innerText = group?.members || 0;
        const container = document.getElementById('groupMembersList');
        container.innerHTML = `<div class="member-item"><div class="member-avatar">${userProfile.avatarType === 'emoji' ? userProfile.avatarData : '👤'}</div><div>${userProfile.nickname}</div></div>`;
    }
    
    function createGroup() {
        let name = prompt("Название группы:", "Мой сервер");
        if (!name) return;
        let groupId = 'g_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        let inviteCode = btoa(groupId).replace(/=/g, '').slice(0, 24);
        savedGroups.push({ id: groupId, name: name, members: 1, inviteCode: inviteCode });
        saveGroups();
        joinGroupById(groupId);
        addSystemMessage(`✨ Группа "${name}" создана! Код: ${inviteCode}`);
        navigator.clipboard.writeText(inviteCode);
    }
    
    function joinGroup() {
        let code = prompt("Введите код приглашения:");
        if (!code) return;
        let found = savedGroups.find(g => g.inviteCode === code || g.id === code);
        if (found) joinGroupById(found.id);
        else addSystemMessage("❌ Группа не найдена");
    }
    
    async function joinGroupById(groupId) {
        if (currentGroupId) await leaveGroup();
        currentGroupId = groupId;
        let group = savedGroups.find(g => g.id === groupId);
        if (group) { group.members = (group.members || 0) + 1; saveGroups(); }
        document.getElementById('groupNameDisplay').innerText = group?.name || "Aether Lite";
        document.getElementById('chatInput').disabled = false;
        document.getElementById('fileBtn').disabled = false;
        document.getElementById('messagesContainer').innerHTML = '';
        if (groupMessages[groupId]) {
            for (let msg of groupMessages[groupId]) {
                addChatMessage(msg.senderNick, msg.text);
            }
        }
        addSystemMessage(`🔊 Присоединились к ${group?.name}`);
        updateGroupMembersUI();
    }
    
    async function leaveGroup() {
        if (!currentGroupId) return;
        if (inVoiceChannel) leaveVoiceChannel();
        let group = savedGroups.find(g => g.id === currentGroupId);
        if (group) group.members = Math.max(0, (group.members || 1) - 1);
        saveGroups();
        addSystemMessage(`👋 Покинули ${group?.name}`);
        currentGroupId = null;
        document.getElementById('groupNameDisplay').innerText = "Aether Lite";
        document.getElementById('chatInput').disabled = true;
        document.getElementById('fileBtn').disabled = true;
        document.getElementById('messagesContainer').innerHTML = '<div style="text-align:center; opacity:0.6;">💡 Создайте или присоединитесь к группе</div>';
        updateGroupMembersUI();
    }
    
    function sendMessage() {
        let input = document.getElementById('chatInput');
        let text = input.value.trim();
        if (!text || !currentGroupId) return;
        saveMessage(currentGroupId, text);
        input.value = '';
    }
    
    // ========== ФАЙЛЫ ==========
    function isExe(name) { return ['exe','msi','bat','cmd','scr'].includes(name.split('.').pop().toLowerCase()); }
    function sendFile() {
        if (!currentGroupId) return;
        let input = document.createElement('input');
        input.type = 'file';
        input.onchange = (e) => {
            let file = e.target.files[0];
            if (!file) return;
            if (isExe(file.name)) { addSystemMessage("⛔ EXE файлы запрещены"); return; }
            if (file.size > 30 * 1024 * 1024) { addSystemMessage("Файл > 30 МБ"); return; }
            let reader = new FileReader();
            reader.onload = (ev) => {
                let fileId = Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                if (!groupFiles[currentGroupId]) groupFiles[currentGroupId] = {};
                groupFiles[currentGroupId][fileId] = { name: file.name, type: file.type, size: file.size, data: ev.target.result };
                localStorage.setItem('aether_files', JSON.stringify(groupFiles));
                addSystemMessage(`📎 Файл: ${file.name}`);
            };
            reader.readAsDataURL(file);
        };
        input.click();
    }
    
    // ========== ДЕМОНСТРАЦИЯ ЭКРАНА ==========
    async function startScreenShare() {
        if (!localStream) return;
        try {
            let screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            let screenTrack = screenStream.getVideoTracks()[0];
            let oldVideo = localStream.getVideoTracks()[0];
            if (oldVideo) localStream.removeTrack(oldVideo);
            localStream.addTrack(screenTrack);
            document.getElementById('localVideo').srcObject = localStream;
            screenTrack.onended = () => {
                if (originalVideoTrack) {
                    localStream.addTrack(originalVideoTrack);
                    document.getElementById('localVideo').srcObject = localStream;
                }
                addSystemMessage("Демонстрация экрана завершена");
            };
            addSystemMessage("🖥️ Демонстрация экрана начата");
        } catch(e) { addSystemMessage("❌ Ошибка демонстрации экрана"); }
    }
    
    function toggleMic() {
        if (!localStream) return;
        micEnabled = !micEnabled;
        localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
        document.getElementById('micToggleBtn').innerHTML = micEnabled ? "🎤" : "🔇";
        addSystemMessage(micEnabled ? "🎤 Микрофон включён" : "🔇 Микрофон выключен");
    }
    
    function toggleCam() {
        if (!localStream) return;
        camEnabled = !camEnabled;
        localStream.getVideoTracks().forEach(t => t.enabled = camEnabled);
        document.getElementById('camToggleBtn').innerHTML = camEnabled ? "📷" : "🚫";
    }
    
    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    document.getElementById('createGroupBtn').onclick = createGroup;
    document.getElementById('joinGroupBtn').onclick = joinGroup;
    document.getElementById('leaveGroupBtn').onclick = leaveGroup;
    document.getElementById('fileBtn').onclick = sendFile;
    document.getElementById('micToggleBtn').onclick = toggleMic;
    document.getElementById('camToggleBtn').onclick = toggleCam;
    document.getElementById('screenBtn').onclick = startScreenShare;
    document.getElementById('closeVideoBtn').onclick = () => document.getElementById('videoPanel').style.display = 'none';
    document.getElementById('chatInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    document.getElementById('generalChannelBtn').onclick = () => addSystemMessage("💬 Вы в текстовом канале");
    document.getElementById('voiceChannelBtn').onclick = () => {
        if (inVoiceChannel) leaveVoiceChannel();
        else joinVoiceChannel();
        document.getElementById('voiceChannelBtn').classList.toggle('active', inVoiceChannel);
    };
    
    requestAllPermissions();
</script>
</body>
</html>
