<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aether Lite — как Discord</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #202225;
            color: #dcddde;
            height: 100vh;
            overflow: hidden;
        }

        /* Discord-подобный лейаут */
        .app {
            display: flex;
            height: 100vh;
        }

        /* Серверная панель (слева, узкая) */
        .servers-bar {
            width: 72px;
            background: #1e1f22;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px 0;
            overflow-y: auto;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #5865f2, #4752c4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 24px;
            color: white;
            position: relative;
        }

        .server-icon:hover {
            border-radius: 16px;
            background: #5865f2;
        }

        .server-icon.active {
            border-radius: 16px;
            background: #5865f2;
        }

        .server-icon.active::before {
            content: '';
            position: absolute;
            left: -12px;
            width: 4px;
            height: 20px;
            background: white;
            border-radius: 4px;
        }

        /* Канальная панель */
        .channels-bar {
            width: 240px;
            background: #2b2d31;
            display: flex;
            flex-direction: column;
            padding: 16px 8px;
        }

        .channel-header {
            padding: 0 8px 16px;
            font-weight: 600;
            font-size: 12px;
            color: #dbdee1;
            border-bottom: 1px solid #1e1f22;
            margin-bottom: 8px;
        }

        .channel-group {
            margin-bottom: 16px;
        }

        .channel-group-name {
            font-size: 12px;
            font-weight: 600;
            color: #949ba4;
            padding: 8px 8px 4px;
            text-transform: uppercase;
        }

        .channel-item {
            padding: 6px 8px;
            margin: 1px 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 15px;
            color: #949ba4;
        }

        .channel-item:hover {
            background: #35373d;
            color: #dbdee1;
        }

        .channel-item.active {
            background: #404249;
            color: #dbdee1;
        }

        /* Основная область: чат + список участников */
        .main-area {
            flex: 1;
            display: flex;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #313338;
        }

        .chat-header {
            height: 48px;
            padding: 0 16px;
            border-bottom: 1px solid #1e1f22;
            display: flex;
            align-items: center;
            font-weight: 600;
            box-shadow: 0 1px 0 0 #1e1f22;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .message-content {
            flex: 1;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }

        .message-author {
            font-weight: 600;
            color: white;
        }

        .message-time {
            font-size: 10px;
            color: #949ba4;
        }

        .message-text {
            font-size: 15px;
            line-height: 1.3;
        }

        .file-attachment {
            background: #1e1f22;
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 6px;
            display: inline-block;
        }

        /* Список участников */
        .members-area {
            width: 240px;
            background: #2b2d31;
            padding: 16px 8px;
            border-left: 1px solid #1e1f22;
        }

        .members-header {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #949ba4;
            padding: 0 8px 12px;
        }

        .member-item {
            padding: 8px;
            margin: 2px 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .member-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            overflow: hidden;
        }

        /* Нижняя панель ввода */
        .input-area {
            padding: 16px;
            background: #383a40;
            margin: 0 16px 16px;
            border-radius: 40px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            background: none;
            border: none;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .action-btn {
            background: none;
            border: none;
            color: #b5bac1;
            cursor: pointer;
            font-size: 20px;
            padding: 4px;
        }

        /* Видеопанель (выдвижная) */
        .video-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e1f22;
            border-radius: 12px;
            padding: 8px;
            display: flex;
            gap: 8px;
            z-index: 100;
            box-shadow: 0 4px 12px black;
        }

        .video-panel video {
            width: 160px;
            border-radius: 8px;
            background: black;
        }

        button {
            background: #5865f2;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 12px;
        }

        .status-badge {
            background: #23a55a;
            border-radius: 50%;
            width: 10px;
            height: 10px;
            position: absolute;
            bottom: 0;
            right: 0;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1f22;
        }
        ::-webkit-scrollbar-thumb {
            background: #202225;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Серверная панель -->
    <div class="servers-bar">
        <div class="server-icon active" id="serverBtn">
            🌀
        </div>
    </div>

    <!-- Каналы -->
    <div class="channels-bar">
        <div class="channel-header">
            <span id="groupNameDisplay">Aether Lite</span>
        </div>
        <div class="channel-group">
            <div class="channel-group-name">Текстовые каналы</div>
            <div class="channel-item active" id="generalChannelBtn">
                <span># 💬</span> <span>общий</span>
            </div>
        </div>
        <div class="channel-group">
            <div class="channel-group-name">Голосовые</div>
            <div class="channel-item" id="voiceChannelBtn">
                <span>🔊</span> <span>Голосовой канал</span>
            </div>
        </div>
        <div style="margin-top: auto; padding: 12px 8px;">
            <button id="createGroupBtn" style="width:100%;">➕ Создать группу</button>
            <button id="joinGroupBtn" style="width:100%; margin-top: 8px;">🔗 Присоединиться</button>
            <button id="leaveGroupBtn" style="width:100%; margin-top: 8px; background:#da373c;">🚪 Выйти</button>
        </div>
    </div>

    <!-- Главная область: чат -->
    <div class="main-area">
        <div class="chat-area">
            <div class="chat-header">
                <span># 💬 общий</span>
            </div>
            <div class="messages-container" id="messagesContainer">
                <div style="text-align:center; opacity:0.6;">💡 Создайте или присоединитесь к группе, чтобы начать общение</div>
            </div>
            <div class="input-area">
                <input type="text" id="chatInput" placeholder="Сообщение..." disabled>
                <button class="action-btn" id="fileBtn" disabled>📎</button>
                <button class="action-btn" id="micToggleBtn" disabled>🎤</button>
                <button class="action-btn" id="camToggleBtn" disabled>📷</button>
                <button class="action-btn" id="screenBtn" disabled>🖥️</button>
            </div>
        </div>

        <!-- Список участников -->
        <div class="members-area">
            <div class="members-header">Участники — <span id="memberCount">0</span></div>
            <div id="membersList"></div>
        </div>
    </div>
</div>

<!-- Видеопанель -->
<div class="video-panel" id="videoPanel" style="display: none;">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <button id="closeVideoBtn" style="background:#da373c; padding:4px 8px;">✖️</button>
</div>

<script>
    // ========== СОСТОЯНИЕ ==========
    let localStream = null;
    let currentGroupId = null;
    let peers = new Map();
    let micEnabled = true;
    let camEnabled = true;
    let screenActive = false;
    let originalVideoTrack = null;

    // Профиль
    let userProfile = JSON.parse(localStorage.getItem('aether_profile') || '{"nickname":"Гость","avatarType":"emoji","avatarData":"👤"}');
    let savedGroups = JSON.parse(localStorage.getItem('aether_groups') || '[]');
    let groupMessages = JSON.parse(localStorage.getItem('aether_messages') || '{}');
    let groupFiles = JSON.parse(localStorage.getItem('aether_files') || '{}');

    let currentUserId = localStorage.getItem('aether_userId');
    if (!currentUserId) {
        currentUserId = 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        localStorage.setItem('aether_userId', currentUserId);
    }

    const configuration = {
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }]
    };

    // ========== ЗАПРОС РАЗРЕШЕНИЙ ==========
    async function requestPermissions() {
        try {
            document.getElementById('messagesContainer').innerHTML = '<div style="text-align:center;">🎥 Запрос камеры и микрофона...</div>';
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            originalVideoTrack = localStream.getVideoTracks()[0];
            document.getElementById('localVideo').srcObject = localStream;
            document.getElementById('videoPanel').style.display = 'flex';
            enableMediaButtons(true);
            addSystemMessage("✅ Доступ к камере и микрофону получен");
            return true;
        } catch(e) {
            addSystemMessage("❌ Нет доступа к камере/микрофону. Разрешите в браузере.");
            return false;
        }
    }

    function enableMediaButtons(enabled) {
        document.getElementById('micToggleBtn').disabled = !enabled;
        document.getElementById('camToggleBtn').disabled = !enabled;
        document.getElementById('screenBtn').disabled = !enabled;
    }

    // ========== СООБЩЕНИЯ (DISCORD-СТИЛЬ) ==========
    function addSystemMessage(text) {
        const container = document.getElementById('messagesContainer');
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `<div class="message-content"><div class="message-text" style="color:#a6a7aa;">📢 ${text}</div></div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function addChatMessage(sender, senderNick, text, fileId = null, isOwn = false) {
        const container = document.getElementById('messagesContainer');
        const div = document.createElement('div');
        div.className = 'message';
        const avatarHtml = `<div class="message-avatar">${userProfile.avatarType === 'emoji' ? userProfile.avatarData : '<img src="'+userProfile.avatarData+'" style="width:100%">'}</div>`;
        let contentHtml = `<div class="message-content">
            <div class="message-header">
                <span class="message-author">${senderNick}</span>
                <span class="message-time">${new Date().toLocaleTimeString()}</span>
            </div>`;
        if (fileId && groupFiles[currentGroupId]?.[fileId]) {
            let file = groupFiles[currentGroupId][fileId];
            if (file.type.startsWith('image/')) {
                contentHtml += `<div class="file-attachment"><img src="${file.data}" style="max-width:200px;max-height:150px;border-radius:8px"><br><a href="${file.data}" download="${file.name}" style="color:#00a8fc;">⬇️ ${file.name}</a></div>`;
            } else {
                contentHtml += `<div class="file-attachment">📎 ${file.name} (${(file.size/1024).toFixed(1)} KB)<br><a href="${file.data}" download="${file.name}" style="color:#00a8fc;">Скачать</a></div>`;
            }
        } else if (text) {
            contentHtml += `<div class="message-text">${escapeHtml(text)}</div>`;
        }
        contentHtml += `</div>`;
        div.innerHTML = avatarHtml + contentHtml;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(s) { return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    function saveMessage(groupId, sender, text, fileId = null) {
        if (!groupMessages[groupId]) groupMessages[groupId] = [];
        groupMessages[groupId].push({ sender, senderNick: userProfile.nickname, text, fileId, time: Date.now() });
        if (groupMessages[groupId].length > 500) groupMessages[groupId].shift();
        localStorage.setItem('aether_messages', JSON.stringify(groupMessages));
        if (currentGroupId === groupId) {
            addChatMessage(sender, userProfile.nickname, text, fileId, sender === currentUserId);
        }
    }

    // ========== ГРУППЫ (DISCORD-СТИЛЬ) ==========
    function saveGroups() { localStorage.setItem('aether_groups', JSON.stringify(savedGroups)); updateMembersUI(); }

    function updateMembersUI() {
        if (!currentGroupId) return;
        const group = savedGroups.find(g => g.id === currentGroupId);
        document.getElementById('memberCount').innerText = group?.members || 0;
        const membersList = document.getElementById('membersList');
        membersList.innerHTML = `<div class="member-item"><div class="member-avatar">${userProfile.avatarType === 'emoji' ? userProfile.avatarData : '👤'}</div><div>${userProfile.nickname}</div></div>`;
    }

    function createGroup() {
        let name = prompt("Название группы (как Discord-сервер):", "Мой сервер");
        if (!name) return;
        let groupId = 'g_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        let inviteCode = btoa(groupId).replace(/=/g, '').slice(0, 24);
        savedGroups.push({ id: groupId, name: name, members: 1, inviteCode: inviteCode });
        saveGroups();
        joinGroupById(groupId);
        addSystemMessage(`✨ Группа "${name}" создана! Код приглашения: ${inviteCode}`);
        navigator.clipboard.writeText(inviteCode);
        addSystemMessage("📋 Код скопирован в буфер обмена");
    }

    function joinGroup() {
        let code = prompt("Введите код приглашения:");
        if (!code) return;
        let found = savedGroups.find(g => g.inviteCode === code || g.id === code);
        if (found) joinGroupById(found.id);
        else addSystemMessage("❌ Группа не найдена");
    }

    async function joinGroupById(groupId) {
        if (currentGroupId) await leaveGroup();
        currentGroupId = groupId;
        let group = savedGroups.find(g => g.id === groupId);
        if (group) { group.members = (group.members || 0) + 1; saveGroups(); }
        document.getElementById('groupNameDisplay').innerText = group?.name || "Aether Lite";
        document.getElementById('chatInput').disabled = false;
        document.getElementById('fileBtn').disabled = false;
        document.getElementById('messagesContainer').innerHTML = '';
        if (groupMessages[groupId]) {
            for (let msg of groupMessages[groupId]) {
                addChatMessage(msg.sender, msg.senderNick, msg.text, msg.fileId, msg.sender === currentUserId);
            }
        }
        addSystemMessage(`🔊 Присоединились к ${group?.name}`);
        updateMembersUI();
    }

    async function leaveGroup() {
        if (!currentGroupId) return;
        let group = savedGroups.find(g => g.id === currentGroupId);
        if (group) group.members = Math.max(0, (group.members || 1) - 1);
        saveGroups();
        addSystemMessage(`👋 Покинули ${group?.name}`);
        currentGroupId = null;
        document.getElementById('groupNameDisplay').innerText = "Aether Lite";
        document.getElementById('chatInput').disabled = true;
        document.getElementById('fileBtn').disabled = true;
        document.getElementById('messagesContainer').innerHTML = '<div style="text-align:center; opacity:0.6;">💡 Создайте или присоединитесь к группе</div>';
        document.getElementById('memberCount').innerText = "0";
        document.getElementById('membersList').innerHTML = '';
    }

    // ========== ФАЙЛЫ ==========
    function isExe(name) { return ['exe','msi','bat','cmd'].includes(name.split('.').pop().toLowerCase()); }
    function sendFile() {
        if (!currentGroupId) return;
        let input = document.createElement('input');
        input.type = 'file';
        input.onchange = (e) => {
            let file = e.target.files[0];
            if (!file) return;
            if (isExe(file.name)) { addSystemMessage("⛔ EXE файлы запрещены"); return; }
            if (file.size > 30 * 1024 * 1024) { addSystemMessage("Файл > 30 МБ"); return; }
            let reader = new FileReader();
            reader.onload = (ev) => {
                let fileId = Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                if (!groupFiles[currentGroupId]) groupFiles[currentGroupId] = {};
                groupFiles[currentGroupId][fileId] = { name: file.name, type: file.type, size: file.size, data: ev.target.result };
                localStorage.setItem('aether_files', JSON.stringify(groupFiles));
                saveMessage(currentGroupId, currentUserId, `Файл: ${file.name}`, fileId);
            };
            reader.readAsDataURL(file);
        };
        input.click();
    }

    // ========== ДЕМОНСТРАЦИЯ ЭКРАНА ==========
    async function startScreenShare() {
        if (!localStream) return;
        try {
            let screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            let screenTrack = screenStream.getVideoTracks()[0];
            let oldVideo = localStream.getVideoTracks()[0];
            if (oldVideo) localStream.removeTrack(oldVideo);
            localStream.addTrack(screenTrack);
            document.getElementById('localVideo').srcObject = localStream;
            screenTrack.onended = () => {
                if (originalVideoTrack) {
                    localStream.addTrack(originalVideoTrack);
                    document.getElementById('localVideo').srcObject = localStream;
                }
                addSystemMessage("Демонстрация экрана завершена");
            };
            addSystemMessage("🖥️ Демонстрация экрана начата");
        } catch(e) { addSystemMessage("❌ Ошибка демонстрации экрана"); }
    }

    function sendMessage() {
        let input = document.getElementById('chatInput');
        let text = input.value.trim();
        if (!text || !currentGroupId) return;
        saveMessage(currentGroupId, currentUserId, text);
        input.value = '';
    }

    function toggleMic() {
        if (!localStream) return;
        micEnabled = !micEnabled;
        localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
        document.getElementById('micToggleBtn').innerHTML = micEnabled ? "🎤" : "🔇";
    }

    function toggleCam() {
        if (!localStream) return;
        camEnabled = !camEnabled;
        localStream.getVideoTracks().forEach(t => t.enabled = camEnabled);
        document.getElementById('camToggleBtn').innerHTML = camEnabled ? "📷" : "🚫";
    }

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    document.getElementById('createGroupBtn').onclick = createGroup;
    document.getElementById('joinGroupBtn').onclick = joinGroup;
    document.getElementById('leaveGroupBtn').onclick = leaveGroup;
    document.getElementById('sendBtn')?.remove();
    document.getElementById('fileBtn').onclick = sendFile;
    document.getElementById('micToggleBtn').onclick = toggleMic;
    document.getElementById('camToggleBtn').onclick = toggleCam;
    document.getElementById('screenBtn').onclick = startScreenShare;
    document.getElementById('closeVideoBtn').onclick = () => document.getElementById('videoPanel').style.display = 'none';
    document.getElementById('chatInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    document.getElementById('generalChannelBtn').onclick = () => addSystemMessage("💬 Вы в текстовом канале");
    document.getElementById('voiceChannelBtn').onclick = () => addSystemMessage("🔊 Голосовой канал (звонок) — в разработке");

    requestPermissions();
</script>
</body>
</html>
